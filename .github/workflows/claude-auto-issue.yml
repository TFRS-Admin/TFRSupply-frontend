# Purpose: Scheduled automation that lets Claude Code pick up small, low-risk
# Ready backlog issues and prepare draft PRs unattended, per this repository's
# own AI_AGENT_OPERATING_MODEL.md / DECISION_ROUTER.md execution rules.
# Requires an ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN) repository secret —
# add it under Settings > Secrets and variables > Actions before this can run.
name: Claude Auto Issue Pickup

on:
  schedule:
    - cron: "0 */4 * * *" # every 4 hours, UTC — adjust to taste
  workflow_dispatch: {} # manual "run now" trigger, e.g. from the GitHub mobile app

concurrency:
  group: claude-auto-issue-pickup
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Claude Code — pick up next low-risk Ready issue
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are running unattended, on a schedule, with no human present to ask
            questions. Follow this repository's own operating rules exactly — read
            AGENTS.md, CLAUDE.md, AI_AGENT_OPERATING_MODEL.md, and DECISION_ROUTER.md
            before doing anything else, per the Session Initialization Protocol.

            ## Scope for this automated run — narrower than a normal session

            You may implement AT MOST ONE issue this run, and only if it satisfies
            every one of these constraints, read from each open issue's `## Metadata`
            block via `gh issue list` / `gh issue view` against live GitHub issues —
            do not trust docs/engineering/BACKLOG.md alone, it is known to lag behind
            real issue state:

              - Status: Ready
              - Blocked: No
              - Priority: P2 or P3 only (never P0 or P1)
              - Risk: Low or Medium only (never High or Critical)
              - Not assigned to a human or another in-flight agent
              - No open PR already exists that references this issue number

            If zero open issues satisfy all of the above, do nothing further: do not
            open a PR, do not comment anywhere, do not invent work. Just stop.

            Choose among qualifying issues using AI_AGENT_OPERATING_MODEL.md#3's
            order: highest Priority, then highest Risk, then smallest Size.

            ## Execution rules

            1. Confirm the chosen issue's acceptance criteria are unambiguous. If
               they are not, stop rather than guessing.
            2. Create a branch using this repository's branch-naming override in
               AGENTS.md (e.g. `bugfix/<issue-number>-<short-slug>`,
               `refactor/<issue-number>-<short-slug>`, `infra/<issue-number>-<short-slug>`
               — pick the prefix matching the issue's actual nature), never a
               `claude/` prefix.
            3. Implement strictly within the issue's acceptance criteria. Do not fix
               unrelated things you notice — note them in the PR description as
               follow-ups instead, per AI_AGENT_OPERATING_MODEL.md#7.
            4. Run `npm run lint`, `npm run typecheck`, `npm run test`, and
               `npm run build`. All four must pass before you proceed. If one fails
               and you cannot fix it within this issue's scope after two attempts,
               stop and leave the branch pushed with a clear note instead of forcing
               a broken PR.
            5. Commit using Conventional Commits, referencing the issue number.
            6. Push the branch and open a **draft** pull request
               (`gh pr create --draft`). Never mark it ready for review and never
               merge — a human always reviews automated PRs before merge. Label the
               PR `automated`. The PR body must follow CLAUDE.md's PR Creation
               Rules: a short summary, a file-by-file change overview, testing/
               validation notes (paste the actual command output, not "should
               work"), and any known follow-up items or risks.
            7. Update the issue's `## Metadata` `Status` line to `In Review` and
               comment on the issue referencing the PR number, per
               AI_AGENT_OPERATING_MODEL.md#5.

            Never push to `main`, never force-push, never touch repository settings,
            secrets, or workflow files, and never merge anything.
